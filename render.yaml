services:
  - type: web
    name: cija-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --no-audit --no-fund --omit=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=350"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      # GEMINI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
      # devem ser configuradas no painel do Render como Secret Files
      - key: FRONTEND_URLS
        sync: false